kind = "api"
previewPath = "/api-legacy"
title = "OG Landmark Laravel API"
description = "Isolated Laravel API development service for OG Landmark. Production remains on the current backend until a verified cutover is approved."
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"
router = "path"

[[services]]
name = "laravel"
paths = [ "/api-legacy/api" ]
localPort = 8000

[services.development]
run = "cd laravel/public && php -d upload_max_filesize=300M -d post_max_size=320M -S 0.0.0.0:$PORT ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"

[services.env]
PORT = "8000"
BASE_PATH = "/api-legacy"
