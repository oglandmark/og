kind = "api"
previewPath = "/api-legacy"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api-legacy"]

[services.development]
run = "cd laravel && php artisan serve --host=0.0.0.0 --port $PORT"

[services.production]

[services.production.build]
args = ["sh", "-lc", "cd laravel && composer install --no-dev --optimize-autoloader --no-interaction && php artisan optimize:clear"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["sh", "-lc", "cd laravel && php artisan serve --host=0.0.0.0 --port $PORT"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
