<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening your OG Landmark dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0B1F3A; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
      main { padding: 28px; text-align: center; }
      p { color: #64748b; }
      a { color: #8b6c2a; font-weight: 700; }
    </style>
    <script>
      (function () {
        var destinationByRole = {
          admin: '/admin/',
          agent: '/portal/agent-dashboard.html',
          seller: '/portal/seller-dashboard.html',
          buyer: '/portal/buyer-dashboard.html'
        };
        var destination = '/auth';
        try {
          var token = localStorage.getItem('og_token');
          var user = JSON.parse(localStorage.getItem('og_user') || 'null');
          var role = String((user && user.role) || '').trim().toLowerCase();
          if (token && user && destinationByRole[role]) {
            destination = destinationByRole[role];
            if (role === 'admin') localStorage.setItem('adminAuth', 'true');
          }
        } catch (error) {}
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <main>
      <strong>Opening your dashboard…</strong>
      <p>If you are not redirected, <a href="/auth">sign in to your account</a>.</p>
    </main>
  </body>
</html>
