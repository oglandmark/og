<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening your OG Landmark dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0B1F3A; font: 15px/1.6 "Segoe UI", system-ui, sans-serif; }
      main { padding: 28px; text-align: center; }
      p { color: #64748b; }
      a { color: #8b6c2a; font-weight: 700; }
    </style>
    <script>
      (function () {
        var destinationByRole = {
          admin: '/admin/',
          agent: '/portal/agent-dashboard.html',
          developer: '/portal/seller-dashboard.html',
          user: '/portal/seller-dashboard.html'
        };
        var destination = '/auth';
        try {
          var token = localStorage.getItem('og_token');
          var user = null;
          try { user = JSON.parse(localStorage.getItem('og_user') || 'null'); } catch (error) {}
          if (!token || !user) {
            var persisted = JSON.parse(localStorage.getItem('og-landmark-store') || 'null');
            var state = persisted && persisted.state;
            if (state && state.token && state.currentUser) {
              token = state.token;
              user = state.currentUser;
              localStorage.setItem('og_token', token);
              localStorage.setItem('og_user', JSON.stringify(user));
            }
          }
          var role = String((user && user.role) || '').trim().toLowerCase();
          var permissions = Array.isArray(user && user.permissions)
            ? user.permissions.map(function (permission) { return String(permission).toLowerCase(); })
            : [];
          var access = ['admin', 'agent', 'developer'].find(function (permission) {
            return permissions.includes(permission);
          }) || role;
          var dashboardAccess = ['admin', 'agent', 'developer'].includes(access) ? access : 'user';
          if (token && user) {
            destination = destinationByRole[dashboardAccess] || destinationByRole.user;
            if (dashboardAccess === 'admin') localStorage.setItem('adminAuth', 'true');
          }
        } catch (error) {}
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <main>
      <strong>Opening your dashboard…</strong>
      <p>If you are not redirected, <a href="/auth">sign in to your account</a>.</p>
    </main>
  </body>
</html>
