openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Public authentication operations
  - name: admin
    description: Administrator operations
paths:
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: A reset code was sent, or the request was accepted without revealing whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResponse"
        "422":
          description: Invalid email address
        "429":
          description: Too many reset requests
        "503":
          description: Email delivery is unavailable
  /auth/reset-password:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Reset a password using an emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]
        "422":
          description: Invalid code, expired code, or invalid password
        "429":
          description: Too many incorrect code attempts
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/users/{id}/agent-cover-access:
    patch:
      operationId: setAgentCoverUploadAccess
      tags: [admin]
      summary: Set Agent cover upload access
      description: Enables or disables cover-photo management for an Agent account. Requires an authenticated administrator.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCoverAccessUpdate"
      responses:
        "200":
          description: Updated Agent account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCoverAccessUser"
        "403":
          description: Administrator authentication required
        "404":
          description: User not found
        "422":
          description: Invalid request or target is not an Agent
  /agent-admin-messages:
    get:
      operationId: getAgentAdminMessages
      tags: [admin]
      summary: List Agent-Admin message threads
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Threads visible to the authenticated Agent or Admin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentAdminThread"
        "403":
          description: Agent or Admin role required
    post:
      operationId: sendAgentAdminMessage
      tags: [admin]
      summary: Send an Agent message to the Admin team
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAdminMessageInput"
      responses:
        "201":
          description: Updated Agent message thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAdminThread"
        "403":
          description: Agent role required
        "422":
          description: Invalid message
  /agent-admin-messages/{threadId}:
    post:
      operationId: replyToAgentMessage
      tags: [admin]
      summary: Reply to an Agent message thread
      security:
        - BearerAuth: []
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAdminMessageInput"
      responses:
        "201":
          description: Updated Agent message thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAdminThread"
        "403":
          description: Administrator authentication required
        "404":
          description: Thread not found
  /agent-progress:
    get:
      operationId: getAgentProgressReports
      tags: [admin]
      summary: List progress reports visible to the authenticated Agent or Admin
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Progress reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentProgressReport"
        "403":
          description: Agent or Admin role required
    post:
      operationId: submitAgentProgressReport
      tags: [admin]
      summary: Submit an Agent daily progress report
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProgressInput"
      responses:
        "201":
          description: Submitted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProgressReport"
        "403":
          description: Agent role required
        "409":
          description: A report already exists for this date
        "422":
          description: Invalid report
  /agent-progress/{id}:
    patch:
      operationId: reviewAgentProgressReport
      tags: [admin]
      summary: Review an Agent progress report
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProgressReview"
      responses:
        "200":
          description: Reviewed progress report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProgressReport"
        "403":
          description: Administrator authentication required
        "404":
          description: Report not found
        "422":
          description: Invalid review
  /users:
    post:
      operationId: createAdminManagedUser
      tags: [admin]
      summary: Create a user account from the Admin mobile panel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManagedUser"
        "403":
          description: Administrator authentication required
        "409":
          description: Email is already in use
        "422":
          description: Invalid account details
  /users/{id}:
    put:
      operationId: updateAdminManagedUser
      tags: [admin]
      summary: Update account details, status, or password
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManagedUser"
        "403":
          description: Administrator authentication required
        "404":
          description: Account not found
        "422":
          description: Invalid account details
  /admin/users/{id}/role:
    patch:
      operationId: updateAdminManagedUserRole
      tags: [admin]
      summary: Change a user role
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [User, Agent, Developer, Admin]
              required: [role]
      responses:
        "200":
          description: Updated account role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminManagedUser"
        "403":
          description: Administrator authentication required
        "422":
          description: Invalid role
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          maxLength: 320
      required: [email]
    PasswordResetResponse:
      type: object
      properties:
        success:
          type: boolean
        smtpOff:
          type: boolean
        message:
          type: string
      required: [success, message]
    PasswordResetConfirmRequest:
      type: object
      properties:
        email:
          type: string
          pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
          maxLength: 320
        code:
          type: string
          pattern: "^\\d{6}$"
        newPassword:
          type: string
          minLength: 8
          maxLength: 1024
      required: [email, code, newPassword]
    AdminUserCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 40
        city:
          type: string
        agencyName:
          type: string
        companyName:
          type: string
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [User, Agent, Developer, Admin]
      required: [name, email, password, role]
    AdminUserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 40
        city:
          type: string
        agencyName:
          type: string
        companyName:
          type: string
        password:
          type: string
          minLength: 8
        status:
          type: string
          enum: [Active, Suspended]
    AdminManagedUser:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
        status:
          type: string
      required: [id, name, email, role]
    AgentCoverAccessUpdate:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    AgentCoverAccessUser:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        role:
          type: string
        agentCoverUploadEnabled:
          type: boolean
      required:
        - id
        - name
        - role
        - agentCoverUploadEnabled
    AgentAdminMessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required: [text]
    AgentAdminMessage:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: number
        senderRole:
          type: string
          enum: [Agent, Admin]
        senderName:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, senderId, senderRole, senderName, text, createdAt]
    AgentAdminThread:
      type: object
      properties:
        id:
          type: string
        agentUserId:
          type: number
        agentName:
          type: string
        agentEmail:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AgentAdminMessage"
        lastMessage:
          type: string
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [open, closed]
      required: [id, agentUserId, agentName, agentEmail, messages, updatedAt, status]
    AgentProgressInput:
      type: object
      properties:
        date:
          type: string
          format: date
        summary:
          type: string
          minLength: 1
          maxLength: 2500
        leadsContacted:
          type: number
          minimum: 0
        visitsCompleted:
          type: number
          minimum: 0
        followUps:
          type: number
          minimum: 0
        blockers:
          type: string
          maxLength: 1500
      required: [date, summary, leadsContacted, visitsCompleted, followUps]
    AgentProgressReview:
      type: object
      properties:
        status:
          type: string
          enum: [reviewed, needs_follow_up]
        adminNote:
          type: string
          maxLength: 1200
      required: [status]
    AgentProgressReport:
      allOf:
        - $ref: "#/components/schemas/AgentProgressInput"
        - type: object
          properties:
            id:
              type: number
            agentUserId:
              type: number
            agentName:
              type: string
            status:
              type: string
              enum: [submitted, reviewed, needs_follow_up]
            adminNote:
              type: string
            submittedAt:
              type: string
              format: date-time
          required: [id, agentUserId, agentName, status, submittedAt]

